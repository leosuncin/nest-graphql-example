services:
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    env_file: .env
    ports:
      - 3306:3306
    volumes:
      - mysql-vol:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: 'mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}'
      interval: 1s
      timeout: 1s
      retries: 60
  adminer:
    image: adminer@sha256:9ead7e126d795c549ce8ad1c7bb8f30a231e061bad769eda704c39c7f609888d
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 8080:8080
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql-vol:
