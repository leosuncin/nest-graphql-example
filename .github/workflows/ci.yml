name: CI

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run the unit tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest
      - name: Install Node.js LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
      - name: Install dependencies
        run: pnpm install
      - name: Run tests
        run: pnpm test:cov --ci --json --testLocationInResults --outputFile=result.json
      - name: Report test results
        uses: tanmen/jest-reporter@b51194185b294febdbe6d848f31f15614a06e2e3 # v1
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Monitor coverage
        uses: slavcodev/coverage-monitor-action@398c4cbbb710e549a8407fdef96ae8b9454d0463 # 1.10.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          coverage_format: clover
          coverage_path: coverage/clover.xml
          check: github.event_name == 'pull_request'
          threshold_alert: 50
          threshold_warning: 80
      - name: Upload code coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage

  e2e:
    name: Run the end to end tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest
      - name: Install Node.js LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
      - name: Start MySQL
        run: sudo systemctl start mysql.service
      - name: Install dependencies
        run: pnpm install
      - name: Create the database and run the migrations
        run: |
          pnpm db:create --synchronize no
          pnpm typeorm migration:run
          pnpm db:seed
        env:
          DATABASE_URL: mysql://root:root@localhost/graphql-example
      - name: Run tests
        run: pnpm test:e2e --ci --json --testLocationInResults --outputFile=result.json
        env:
          PORT: 3000
          DATABASE_URL: mysql://root:root@localhost/graphql-example
      - name: Report test results
        uses: tanmen/jest-reporter@b51194185b294febdbe6d848f31f15614a06e2e3 # v1
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          action-name: e2e report
